# ==========================================================================
# Oracle Schema Duplicator — configuration typee
# ==========================================================================
#
# Copier ce fichier vers `config/config.conf` et l'adapter.
#
# Format volontairement minimal, et NON execute par un shell :
#
#     CLE=VALEUR
#     CLE="VALEUR avec espaces"
#
# Refuses : `export X=`, `$(...)`, backquotes, `;`, `&&`, `||`, `>`, `<`,
# heredoc, continuation par `\`.
#
# Priorite, de la plus faible a la plus forte :
#
#     defaut du schema  <  ce fichier  <  OSD_<CLE>  <  --set CLE=VALEUR
#
# Le fichier est lu ligne a ligne par un parseur strict avec liste blanche.
# Une cle inconnue est une erreur (code 1), pas un avertissement : une
# faute de frappe silencieuse est la cause la plus longue a diagnostiquer
# d'un run qui « marche mais ne fait rien ».
#
# Le schema complet et affiche par :  osd config
# Une cle detaillee par             :  osd config <CLE>
# ==========================================================================


# --------------------------------------------------------------------------
# Ce qui est duplique
# --------------------------------------------------------------------------
SOURCE_SCHEMA=HR
TARGET_SCHEMA=HR_UAT

# `REMAP_SCHEMA` est toujours applique (SOURCE_SCHEMA -> TARGET_SCHEMA).
# Aucune option ne permet de le desactiver : une duplication vers le meme
# nom n'a de sens que si l'on accepte explicitement d'ecraser la cible.
#
# La source et la cible ne peuvent pas porter le meme nom, sauf
# ALLOW_EXISTING_TARGET=true. Le cas est refuse a la lecture : un
# export puis import dans le meme schema n'est pas une duplication, et
# l'oubli de TARGET_SCHEMA n'apparaitrait qu'apres l'avoir constate.


# --------------------------------------------------------------------------
# Connexion source
# --------------------------------------------------------------------------
SOURCE_CONNECT=L_PROD

# Objet DIRECTORY Oracle ou `expdp` ecrira le dump. DOIT designer un
# chemin du systeme de fichiers, jamais un chemin ASM (`+DATA/...`) :
# le transfert ne peut pas lire l'ASM depuis le serveur de saut.
SOURCE_DIRECTORY=DP_DIR

# Chemin du wallet Oracle sur l'hote source. N'est pas copie par l'outil :
# il doit deja exister et etre lisible par le compte qui execute.
SOURCE_WALLET=/opt/oracle/wallet

# TNS_ADMIN sur l'hote source. **Obligatoire si SOURCE_CONNECT est un
# alias TNS** et que le compte n'a pas de profil interactif : un login
# SSH non interactif ne source pas `.profile`, donc `tnsnames.ora` ne
# serait pas trouve et la connexion echouerait en ORA-12154.
SOURCE_TNS_ADMIN=/opt/oracle/network/admin

# Renseigne uniquement si l'hote n'a pas de client en `PATH`, et
# seulement si aucun wallet n'est configure.
SOURCE_USER=

# Se connecter en SYSDBA. Necessaire dans le cas courant d'un wallet
# d'exploitation : le compte dument provisionne dans le wallet n'a
# generalement pas les droits necessaires au dump complet, et
# l'extraction d'un schema donne ORA-28009 ou ORA-01031.
#
# `expdp` **refuse** `AS_SYSDBA` sur sa ligne de commande (LRM-00112) ;
# l'outil ne le passe donc jamais par argv, mais uniquement dans le
# parfile, ou il est accepte. Voir docs/REMOTE_PROTOCOL.md.
SOURCE_SYSDBA=true


# --------------------------------------------------------------------------
# Connexion cible
# --------------------------------------------------------------------------
TARGET_CONNECT=L_UAT
TARGET_DIRECTORY=DP_DIR
TARGET_WALLET=/opt/oracle/wallet
TARGET_TNS_ADMIN=/opt/oracle/network/admin

# Comme SOURCE_USER : inutile avec un wallet.
TARGET_USER=

# Comme SOURCE_SYSDBA. `impdp` comme `expdp` : uniquement par parfile.
TARGET_SYSDBA=true


# --------------------------------------------------------------------------
# Ou s'executent les operations
# --------------------------------------------------------------------------
# *_HOST vide => execution locale (les bases sont sur ce serveur).
# Renseigne   => execution distante sur l'hote qui heberge la base, par
# Ansible. C'est le mode normal : le serveur de saut n'a pas de client
# Oracle.
#
# Ce sont des **noms d'inventaire**, pas des adresses. Si l'inventaire
# pose `ansible_host`, le nom et l'adresse peuvent differer -- c'est
# recommande, car le nom survit au changement d'adresse.
SOURCE_HOST=ora-prod-aix01
TARGET_HOST=ora-uat-aix01

# Inventaire Ansible. Il designe qui est execute, et porte les
# identifiants SSH chiffres par Ansible Vault.
#
# Chemin **absolu** de preference. Un chemin relatif est resolu par
# rapport au repertoire d'execution, donc fragile sous cron.
OSD_INVENTORY=/etc/osd/inventory/hosts

# Fichier de mot de passe du coffre. Hors du depot, en mode 0600 : il
# doit etre verifie en amont, parce qu'un secret lisible par d'autres
# n'est plus un secret.
#
# Ce n'est PAS le mot de passe SSH, ni le mot de passe Oracle : c'est
# celui qui dechiffre `group_vars/all.yml`, lequel contient le mot de
# passe SSH. Les mots de passe Oracle passent par un wallet
# (`SOURCE_WALLET` plus loin), jamais par ce fichier.
OSD_VAULT_PASSWORD_FILE=/etc/osd/vault-pass

# Les options suivantes ont ete retirees. Elles restent decrites -- donc
# tolerees a vide -- pour qu'un fichier de configuration existant soit
# lu sans erreur de cle inconnue, mais toute valeur portee est refusee
# a la lecture. Les identifiants SSH appartiennent desormais a
# l'inventaire, chiffres par Vault : les ecrire ici les mettrait dans un
# fichier ordinaire, donc dans une sauvegarde, et dans la sauvegarde de
# cette sauvegarde.
#
#OS_SSH_USER=
#SOURCE_SSH_USER=
#TARGET_SSH_USER=
#SOURCE_SSH_OPTS=
#TARGET_SSH_OPTS=
#SSH_KEY=


# --------------------------------------------------------------------------
# Data Pump
# --------------------------------------------------------------------------
# ALL | DATA_ONLY | METADATA_ONLY
#
# METADATA_ONLY ne transporte que le DDL : l'import cree la structure
# sans les donnees. L'estimation d'espace bascule alors sur le nombre
# d'objets, et le controle d'espace du tablespace cible est ignore —
# il serait faux d'exiger la place des segments pour un dump qui ne les
# contient pas.
CONTENT=ALL

# ALL | DATA_ONLY | METADATA_ONLY | NONE
COMPRESSION=ALL

# Au-dela de 1, `expdp` produit `base-01.dmp`, `base-02.dmp`, ...
# Le nombre de parties est choisi par Data Pump selon la volumetrie : il
# n'est pas devinable, il est decouvert apres coup. `impdp` reconstitue
# l'ensemble grace au jeton `%d` et signale ORA-39059 si une partie
# manque, ce qui en fait un controle d'integrite supplementaire.
PARALLEL=4

# Prefixe du job Data Pump et des artefacts. Doit tenir en 30
# caracteres avec le nom de run (limite Oracle sur SYS.SYS_EXPORT_*_NN).
JOB_PREFIX=OSD

# Taille maximale d'une partie, en Mo. 0 = illimite. A utiliser pour
# que chaque partie tienne sur un support amovible, ou pour borner la
# duree d'un transfert interrompu.
FILESIZE_MB=0

# `EXCLUDE` / `INCLUDE` : motifs Data Pump, separees par des virgules.
# Attention a la syntaxe : `TABLE:DEPT` exclut la table, `TABLE:HR.V_*`
# exclut par motif. Le caractere `*` est le joker Data Pump, pas un glob
# shell — le fichier n'est de toute facon jamais execute.
EXCLUDE=
INCLUDE=

# -- Obsoletes ---------------------------------------------------------------
# Ces trois cles ne sont honorees par aucun code. Elles restent acceptees
# pour ne pas casser un fichier de configuration existant, mais une
# valeur non vide est refusee : une option acceptee et ignoree est pire
# qu'une option refusee, car elle laisse croire a un comportement qui
# n'existe pas.
#
# Le transfert passe par le serveur de saut, qui n'a besoin d'aucun
# client Oracle ; le relais local n'a donc jamais ete necessaire.
# STAGING_DIR=
# REMOTE_TRANSFER=false

# Paires SOURCE:DESTINE, separees par des virgules. Ce sont les
# tablespaces **de la cible apres remap** qui sont controles a l'etape 8.
# Laisses vides, les tablespaces sont decouverts depuis le dump et aucun
# controle d'existence n'est possible.
REMAP_TABLESPACE=USERS:UATDATA


# --------------------------------------------------------------------------
# Securite — garde-fous
# --------------------------------------------------------------------------
# Refuse par defaut d'ecraser un schema cible deja peuple. Le refus est
# un code 8 (securite) et non un code 2 : ce n'est pas un prerequis
# manquant, c'est une operation qui n'a pas ete explicitement demandee.
#
# SKIP conserve l'existant et n'ajoute que ce qui manque — c'est la
# duplication partielle. REPLACE ecrase, et demande en plus
# --allow-destructive.
ALLOW_EXISTING_TARGET=false

# SKIP | APPEND | TRUNCATE | REPLACE
#
# Defaut SKIP, volontairement. Les autres Consequences :
#   APPEND    ajoute des lignes ; peut violer une cle unique
#   TRUNCATE  vide les tables puis insere ; detruit les donnees
#   REPLACE  supprime et recree ; detruit tout
#
# TRUNCATE et REPLACE exigent `--allow-destructive`. Le refus est code 8.
TABLE_EXISTS_ACTION=SKIP

# DIT par la configuration et reclame par l'option. Les deux sont
# necessaires : une option seule disparaitrait au premier cron, et une
# configuration seule autoriserait un `run` quotidien a ecraser.
ALLOW_DESTRUCTIVE=false

# Repli degrade. A proscrire : le mot de passe apparait alors dans les
# arguments de processus de l'hote et dans les journaux Data Pump.
# Utiliser un wallet (SOURCE_WALLET / TARGET_WALLET).
PASSWORD=


# --------------------------------------------------------------------------
# Transfert
# --------------------------------------------------------------------------
# AUTO       sonde les mecanismes et retient le premier qui fonctionne
#            reellement (aller-retour ecrit + verification d'integrite)
# LOCAL      les deux repertoires DIRECTORY sont identiques ou partages
# SCP        force scp
# SCP-LEGACY force scp -O (AIX dont le sshd n'expose pas le sous-systeme
#            sftp, cas le plus courant)
# RSYNC      force rsync (seul backend reprenable apres interruption)
# SFTP       force sftp
#
# AUTO est le defaut parce qu'un binaire present ne prouve rien : un
# scp installe peut ne pas fonctionner si le sshd n'expose pas sftp.
# Seule une copie reelle le demontre.
TRANSFER_MODE=AUTO


# --------------------------------------------------------------------------
# Espace
# --------------------------------------------------------------------------
# Marge de securite appliquee aux deux controles d'espace (disque du
# DIRECTORY et tablespaces de la cible). L'estimation est approximative
# par nature : elle sert a echouer tot, pas a garantir l'issue.
SPACE_MARGIN_PERCENT=10
SPACE_MARGIN_ABS_MB=512

# Plancher absolu exige sur le disque portant le DIRECTORY, en Mo.
# Utile quand le schema est petit mais que le disque doit rester
# utilisable pour la production.
MIN_FREE_SPACE_MB=0


# --------------------------------------------------------------------------
# Validation
# --------------------------------------------------------------------------
# MINIMAL   controle que l'import a abouti
# STANDARD  (defaut) inventaire et absence d'objet invalide
# FULL      bilan detaille des differences source/cible
VALIDATION_LEVEL=STANDARD


# --------------------------------------------------------------------------
# Journalisation, rapports, execution
# --------------------------------------------------------------------------
# DEBUG | INFO | WARNING | ERROR
LOG_LEVEL=INFO

LOG_DIR=logs
WORK_DIR=work
REPORT_DIR=reports

# Repertoire de verrou. Vide => WORK_DIR. **Doit etre local, jamais NFS** :
# `lockf` et le repli `mkdir` reposent tous deux sur la semantique du
# systeme de fichiers, et NFS la rend approximative — donc silencieusement
# fausse sur deux serveurs distincts.
LOCK_DIR=

# Conserve le dump et les journaux apres succes, pour analyse ulterieure.
# Desactiver pour un run regulier ; laisser actif pour une premiere
# mise en service ou un incident.
KEEP_ARTIFACTS=false

# Nettoyage du dump distant apres import reussi (defaut) ou non.
# Le nettoyage n'a jamais lieu apres un echec, sauf CLEANUP_ON_FAILURE.
CLEANUP_AFTER_SUCCESS=true

# Supprime les artefacts meme en cas d'echec. Destructif : exige
# --allow-destructive.
#
# Refuse par defaut parce qu'un echec d'import laisse un schema cible
# partiellement peuple : le dump est alors la seule voie de reprise
# manuelle, et le supprimer la supprime.
CLEANUP_ON_FAILURE=false

# TEXT | JSON | BOTH
REPORT_FORMAT=TEXT

# Simulation complete : aucune ecriture en base. Realise par substitution
# d'un Runner qui n'execute rien, et non par des `if` disperses — un
# dry-run ne peut donc pas diverger du chemin reel.
DRY_RUN=false

# Identifiant de run. Vide => genere. Le fixer est utile pour reprendre
# apres un incident a partir d'une sauvegarde d'etat.
RUN_ID=
